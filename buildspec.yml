version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - BUILD_ARCHITECTURE=${BUILD_ARCHITECTURE:-amd64}
      - |
        case "$BUILD_ARCHITECTURE" in
          x86_64) BUILD_ARCHITECTURE=amd64 ;;
          aarch64) BUILD_ARCHITECTURE=arm64 ;;
        esac
      - BUILD_PLATFORM=linux/$BUILD_ARCHITECTURE
      - API_IMAGE_REPO_NAME=${API_IMAGE_REPO_NAME:-${IMAGE_REPO_NAME}-api}
      - WORKER_IMAGE_REPO_NAME=${WORKER_IMAGE_REPO_NAME:-${IMAGE_REPO_NAME}-worker}
      - WEB_IMAGE_REPO_NAME=${WEB_IMAGE_REPO_NAME:-${IMAGE_REPO_NAME}-web}
      - API_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$API_IMAGE_REPO_NAME
      - WORKER_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$WORKER_IMAGE_REPO_NAME
      - WEB_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$WEB_IMAGE_REPO_NAME
      - docker buildx inspect backup-orchestrator-builder >/dev/null 2>&1 || docker buildx create --name backup-orchestrator-builder --driver docker-container
      - docker buildx use backup-orchestrator-builder

  build:
    commands:
      - echo "Build and push API image on `date`"
      - docker buildx build --platform $BUILD_PLATFORM --push -f apps/api/Dockerfile -t $API_REPOSITORY_URI:$IMAGE_TAG -t $API_REPOSITORY_URI:$COMMIT_HASH --cache-from=type=registry,ref=$API_REPOSITORY_URI:buildcache --cache-to=type=registry,ref=$API_REPOSITORY_URI:buildcache,mode=max .
      - echo "Build and push worker image on `date`"
      - docker buildx build --platform $BUILD_PLATFORM --push -f apps/worker/Dockerfile -t $WORKER_REPOSITORY_URI:$IMAGE_TAG -t $WORKER_REPOSITORY_URI:$COMMIT_HASH --cache-from=type=registry,ref=$WORKER_REPOSITORY_URI:buildcache --cache-to=type=registry,ref=$WORKER_REPOSITORY_URI:buildcache,mode=max .
      - echo "Build and push web image on `date`"
      - docker buildx build --platform $BUILD_PLATFORM --push -f apps/web/Dockerfile -t $WEB_REPOSITORY_URI:$IMAGE_TAG -t $WEB_REPOSITORY_URI:$COMMIT_HASH --cache-from=type=registry,ref=$WEB_REPOSITORY_URI:buildcache --cache-to=type=registry,ref=$WEB_REPOSITORY_URI:buildcache,mode=max .
      - echo "Build and push completed on `date`"
      - printf '[{"name":"api","imageUri":"%s"},{"name":"worker","imageUri":"%s"},{"name":"web","imageUri":"%s"}]' $API_REPOSITORY_URI:$COMMIT_HASH $WORKER_REPOSITORY_URI:$COMMIT_HASH $WEB_REPOSITORY_URI:$COMMIT_HASH > imagedefinitions.json
      - cat imagedefinitions.json

cache:
  paths:
    - '/root/.docker/**/*'

artifacts:
  files:
    - imagedefinitions.json