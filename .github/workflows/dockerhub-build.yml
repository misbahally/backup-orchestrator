name: Build and Push to Docker Hub

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Auto Tag Version"]
    types:
      - completed

env:
  REGISTRY: docker.io
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/backup-orchestrator

jobs:
  build-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD_BUILD="true"
          TAG=""

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ -z "$TAG" ]; then
              echo "No tag found for push ref: ${GITHUB_REF}" >&2
              exit 1
            fi
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
            RUN_JOBS_JSON=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")

            STEP_CONCLUSION=$(printf '%s' "$RUN_JOBS_JSON" | python -c "import json,sys; payload=json.load(sys.stdin); print(next((step.get('conclusion') or '' for job in payload.get('jobs', []) if job.get('name') == 'tag-version' for step in job.get('steps', []) if step.get('name') == 'Create and push tag'), ''))")

            if [ "$STEP_CONCLUSION" != "success" ]; then
              echo "Auto Tag did not create a new tag (step conclusion: ${STEP_CONCLUSION:-none}); skipping build."
              SHOULD_BUILD="false"
            fi

            VERSION=$(python -c "import ast,pathlib; tree=ast.parse(pathlib.Path('libs/orchestrator_core/orchestrator_core/__init__.py').read_text(encoding='utf-8')); values=[node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)]; assert len(values) == 1, 'Expected exactly one string __version__ assignment'; print(values[0].strip())")

            TAG="v${VERSION}"

            if [ "$SHOULD_BUILD" = "true" ]; then
              git fetch --tags origin
              TAG_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
              if [ -z "$TAG_SHA" ]; then
                echo "Tag ${TAG} not found; skipping build."
                SHOULD_BUILD="false"
              elif [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
                echo "Tag ${TAG} points to ${TAG_SHA}, not ${SOURCE_SHA}; skipping build."
                SHOULD_BUILD="false"
              fi
            fi
          fi

          COMMIT_HASH=$(echo "$SOURCE_SHA" | cut -c 1-7)
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip build summary
        if: steps.meta.outputs.should_build != 'true'
        run: |
          echo "No matching release tag on this commit; build skipped."

      - name: Build and push API image
        if: steps.meta.outputs.should_build == 'true'
        id: build_api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache,mode=max

      - name: Build and push Worker image
        if: steps.meta.outputs.should_build == 'true'
        id: build_worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache,mode=max

      - name: Build and push Web image
        if: steps.meta.outputs.should_build == 'true'
        id: build_web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_REF=${{ steps.meta.outputs.commit_hash }}
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache,mode=max

      - name: Publish image digest summary
        if: steps.meta.outputs.should_build == 'true'
        run: |
          {
            echo "### Published image digests";
            echo "- API: ${{ env.IMAGE_BASE }}-api@${{ steps.build_api.outputs.digest }}";
            echo "- Worker: ${{ env.IMAGE_BASE }}-worker@${{ steps.build_worker.outputs.digest }}";
            echo "- Web: ${{ env.IMAGE_BASE }}-web@${{ steps.build_web.outputs.digest }}";
          } >> "$GITHUB_STEP_SUMMARY"
