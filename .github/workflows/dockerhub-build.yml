name: Build and Push to Docker Hub

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/backup-orchestrator

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "No tag found for this build ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c 1-7)
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build_api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache,mode=max

      - name: Build and push Worker image
        id: build_worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache,mode=max

      - name: Build and push Web image
        id: build_web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_REF=${{ steps.meta.outputs.commit_hash }}
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.commit_hash }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache,mode=max

      - name: Publish image digest summary
        run: |
          {
            echo "### Published image digests";
            echo "- API: ${{ env.IMAGE_BASE }}-api@${{ steps.build_api.outputs.digest }}";
            echo "- Worker: ${{ env.IMAGE_BASE }}-worker@${{ steps.build_worker.outputs.digest }}";
            echo "- Web: ${{ env.IMAGE_BASE }}-web@${{ steps.build_web.outputs.digest }}";
          } >> "$GITHUB_STEP_SUMMARY"
