services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backup_control}
      POSTGRES_USER: ${POSTGRES_USER:-backup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backup}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backup} -d ${POSTGRES_DB:-backup_control}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  migrate:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://backup:backup@postgres:5432/backup_control}
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backup-orchestrator-api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://backup:backup@postgres:5432/backup_control}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      API_KEYS: ${API_KEYS:-}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-true}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-2h}
      FILE_SOURCE_ALLOWED_ROOTS: ${FILE_SOURCE_ALLOWED_ROOTS:-/data:/mnt/backups}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://backup:backup@postgres:5432/backup_control}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-2h}
      FILE_SOURCE_ALLOWED_ROOTS: ${FILE_SOURCE_ALLOWED_ROOTS:-/data:/mnt/backups}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: ${WORKER_METRICS_PORT:-9090}
    command: ["python", "worker_main.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker_main.py >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: 2.0
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://backup:backup@postgres:5432/backup_control}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RQ_JOB_TIMEOUT: ${RQ_JOB_TIMEOUT:-2h}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_PORT: ${SCHEDULER_METRICS_PORT:-9090}
    command: ["python", "scheduler.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/scheduler.heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
      - ./apps/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backup-orchestrator-api

volumes:
  pgdata:
  minio_data:
