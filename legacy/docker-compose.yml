version: "3.8"

services:
  # ── Backup Orchestrator ────────────────────────────────────────────────────
  backup-orchestrator:
    build: .
    image: backup-orchestrator:latest
    container_name: backup-orchestrator
    restart: unless-stopped
    environment:
      # Source AWS
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # Destination (S3-compatible)
      DEST_PROVIDER: ${DEST_PROVIDER}
      DEST_ENDPOINT: ${DEST_ENDPOINT}
      DEST_REGION: ${DEST_REGION}
      DEST_BUCKET: ${DEST_BUCKET}
      DEST_ACCESS_KEY: ${DEST_ACCESS_KEY}
      DEST_SECRET_KEY: ${DEST_SECRET_KEY}

      # Source enablement
      ENABLE_EFS: ${ENABLE_EFS:-false}
      EFS_FS_IDS: ${EFS_FS_IDS:-}
      DATA_SYNC_TASK_ARN: ${DATA_SYNC_TASK_ARN:-}

      ENABLE_S3: ${ENABLE_S3:-false}
      S3_BUCKETS: ${S3_BUCKETS:-}
      S3_REPLICATION_ROLE_ARN: ${S3_REPLICATION_ROLE_ARN:-}

      ENABLE_EBS: ${ENABLE_EBS:-false}
      EBS_VOLUME_IDS: ${EBS_VOLUME_IDS:-}
      EBS_SNAP_PREFIX: ${EBS_SNAP_PREFIX:-Backup}

      ENABLE_RDS: ${ENABLE_RDS:-false}
      RDS_IDENTIFIERS: ${RDS_IDENTIFIERS:-}
      RDS_KMS_KEY_ID: ${RDS_KMS_KEY_ID:-}

      # Retention & scheduling
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      SCHEDULE: ${SCHEDULE:-0 2 * * *}
      METRICS_PORT: "9090"
      RCLONE_BW_LIMIT: ${RCLONE_BW_LIMIT:-100M}
    volumes:
      # Mount AWS credentials and rclone config from host
      - ${AWS_CREDENTIALS_DIR:-~/.aws}:/root/.aws:ro
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/root/.config/rclone:ro
    ports:
      - "9090:9090"  # Prometheus metrics
    networks:
      - backup-net

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - backup-net

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - backup-net
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  backup-net:
    name: backup-monitoring
